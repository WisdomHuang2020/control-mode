name: Deploy to Tencent Lighthouse

# 正式通道：腾讯轻量云 43.142.148.37 上的 nginx。
# 主服务域名 https://www.control-mode.power-knowledge.tech/（裸名 301 归一）
# web 根 /var/www/control-mode —— 必须等于 nginx 的 root 指令。
#
# 与站群其余 React 站（LLC / interleaved-pfc / AHB）的 deploy-lighthouse.yml 同构。
# 首次部署的密钥与 secrets 尚未配置时，本工作流优雅跳过（会显示绿勾但不部署 —— 假绿来源）。
# 判断是否真的部署了，必须下钻到步骤级看 `Deploy to server over SSH` 是 success 而不是 skipped。
#
# 所需 repository secrets（由仓库所有者在 GitHub 网页填写一次）：
#   LH_HOST     43.142.148.37
#   LH_USER     root
#   LH_ROOT     /var/www/control-mode
#   LH_SSH_KEY  本站专用部署私钥全文（对应服务器 root 的 authorized_keys）
#   LH_PORT     可选，缺省 22

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "lighthouse"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check configuration
        id: cfg
        env:
          LH_HOST: ${{ secrets.LH_HOST }}
          LH_USER: ${{ secrets.LH_USER }}
          LH_ROOT: ${{ secrets.LH_ROOT }}
          LH_SSH_KEY: ${{ secrets.LH_SSH_KEY }}
        run: |
          if [ -z "$LH_HOST" ] || [ -z "$LH_USER" ] || [ -z "$LH_ROOT" ] || [ -z "$LH_SSH_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=已跳过轻量云部署::未配置 LH_HOST/LH_USER/LH_ROOT/LH_SSH_KEY，本次不上传任何文件。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "配置齐备，将部署到 $LH_USER@$LH_HOST:$LH_ROOT"
          fi

      - name: Setup Node
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.cfg.outputs.ready == 'true'
        run: npm ci

      # 与 Pages 通道同一套质量门禁：计算内核独立复核 + 版本号单一来源断言。
      - name: Test
        if: steps.cfg.outputs.ready == 'true'
        run: npm test

      - name: Build
        if: steps.cfg.outputs.ready == 'true'
        run: npm run build

      - name: Deploy to server over SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          LH_HOST: ${{ secrets.LH_HOST }}
          LH_USER: ${{ secrets.LH_USER }}
          LH_ROOT: ${{ secrets.LH_ROOT }}
          LH_SSH_KEY: ${{ secrets.LH_SSH_KEY }}
          LH_PORT: ${{ secrets.LH_PORT }}
        run: |
          set -euo pipefail
          PORT="${LH_PORT:-22}"
          WEB_OWNER=www-data

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$LH_SSH_KEY" > ~/.ssh/lh_key
          chmod 600 ~/.ssh/lh_key
          ssh-keyscan -p "$PORT" -H "$LH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH_CMD="ssh -p $PORT -i $HOME/.ssh/lh_key -o BatchMode=yes -o ConnectTimeout=20 $LH_USER@$LH_HOST"

          echo "::group::服务器环境"
          $SSH_CMD "whoami; hostname; echo '--- web root ---'; ls -la '$LH_ROOT' | head -20"
          echo "::endgroup::"

          # ── 降级护栏：拒绝旧 run 覆盖线上新版本（interleaved-pfc 2026-09-21 事故）──
          ART_VER=$(node -p "require('./package.json').version")
          LIVE_VER=$($SSH_CMD "cat '$LH_ROOT/.deployed-version' 2>/dev/null || true" \
                     | tr -d '\r\n' | head -c 64)
          echo "本次产物版本 : $ART_VER"
          echo "线上已部署版本: ${LIVE_VER:-（无记录）}"
          if [ -n "$LIVE_VER" ] && [ "$LIVE_VER" != "$ART_VER" ]; then
            OLDEST=$(printf '%s\n%s\n' "$LIVE_VER" "$ART_VER" | sort -V | head -1)
            if [ "$OLDEST" = "$ART_VER" ]; then
              echo "::error title=拒绝降级部署::本次产物 $ART_VER 严格早于线上 $LIVE_VER，已中止。"
              exit 1
            fi
          fi

          # 上传前备份（失败不阻断）
          $SSH_CMD "tar czf ~/webroot-backup-\$(date +%F-%H%M%S).tar.gz -C '$LH_ROOT' . 2>/dev/null || true"

          # tar over ssh，不依赖 rsync；不做删除，避免线上 rm 的风险不对称。
          tar czf - -C dist . | $SSH_CMD "tar xzf - --no-same-owner -C '$LH_ROOT'"
          $SSH_CMD "chown -R $WEB_OWNER:$WEB_OWNER '$LH_ROOT'" || true

          # 版本哨兵：门户 /api/version/control-mode 读它，下一次部署也用它做降级比对。
          # 格式必须不带 v 前缀，入口站 useLiveVersions.ts 的锚定正则是 ^v?(\d+\.\d+\.\d+)$。
          $SSH_CMD "printf '%s\n' '$ART_VER' > '$LH_ROOT/.deployed-version'"
          echo "已写入版本哨兵：$LH_ROOT/.deployed-version = $ART_VER"

          # commit 哨兵：与服务器拉取式脚本共用同一份记录，便于审计与通道切换时避免重复部署。
          $SSH_CMD "printf '%s\n' '$GITHUB_SHA' > '$LH_ROOT/.deployed-commit'"
          echo "已写入 commit 哨兵：$LH_ROOT/.deployed-commit = $GITHUB_SHA"

      # 自检只做体检，绝不当门禁：境外 runner 到本服务器的 TLS 握手常被中间设备中断，
      # 但部署本身已成功（LLC 工作流实证）。硬门禁只在上面的 Deployment 步。
      - name: Verify live site (self-check, never blocks)
        if: steps.cfg.outputs.ready == 'true'
        continue-on-error: true
        env:
          LH_HOST: ${{ secrets.LH_HOST }}
        run: |
          set +e
          set -uo pipefail
          DOMAIN=www.control-mode.power-knowledge.tech
          URL="https://$DOMAIN/"
          LIVE=/tmp/live.html
          ok=0
          for i in 1 2 3; do
            code=$(curl -sS -o "$LIVE" -w '%{http_code}' -m 20 "$URL"); rc=$?
            echo "第 ${i} 次请求：http=$code curl_exit=$rc"
            if [ "$rc" = 0 ] && [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ] && [ -n "${LH_HOST:-}" ]; then
            code=$(curl -sS -o "$LIVE" -w '%{http_code}' -m 20 --resolve "$DOMAIN:443:$LH_HOST" "$URL")
            echo "改走 IP（SNI 不变）：http=$code"
          fi
          if [ "$ok" = 1 ]; then
            LOCAL_JS=$(basename "$(ls dist/assets/index-*.js | head -1)")
            echo "本次构建入口 JS: $LOCAL_JS"
            if grep -q "$LOCAL_JS" "$LIVE"; then
              echo "::notice title=核验通过::线上入口 JS 与本次构建一致（$LOCAL_JS）"
            else
              echo "::warning title=核验存疑::线上入口 JS 与本次构建不一致"
            fi
          else
            echo "::warning title=自检未通过（不影响部署）::域名多次访问均失败，请以线上产物为准。"
          fi
          exit 0
