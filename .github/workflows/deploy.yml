name: Deploy to GitHub Pages

# 兜底通道：与 deploy-lighthouse.yml 的轻量云正式通道并行独立。
# Pages 是子路径托管，App.tsx 会自动切到 HashRouter。

on:
  workflow_dispatch:
  # ⚠ GitHub Pages 兜底通道默认不自动跑：站点尚未启用时 configure-pages 会失败，
  #   让 main 分支出现与本站无关的红灯。启用步骤：
  #     ① 仓库 Settings → Pages → Build and deployment 选「GitHub Actions」
  #     ② 仓库变量 PAGES_ENABLED 设为 true
  #     ③ 放开下面这两行，让 push main 也触发
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # 未启用 Pages 时整条 job 跳过（skipped），不产生红灯，也不造成「假绿」。
    if: vars.PAGES_ENABLED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (计算内核 + 版本断言)
        run: npm test

      # Pages 托管在 /control-mode/ 子路径，必须单独以该 base 构建；
      # 与正式通道（base '/'）不复用同一份 dist。
      - name: Build (Pages subpath)
        run: npm run build -- --base /control-mode/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
