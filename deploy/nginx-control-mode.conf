# control-mode.power-knowledge.tech —— 开关变换器 · 建模与控制知识工程站
#
# 形态：Vite + React SPA。dist/ 为发布产物，落在 /var/www/control-mode。
#   SPA 需要 try_files 回退到 /index.html；这与零构建多页站（web-training）的「真 404」策略不同。
#
# 对外只认 www：裸名 301 归一。canonical / og:url 里都应写 www。
# 证书单独签发（control-mode.power-knowledge.tech，webroot HTTP-01 双名）：
#   www.control-mode.* 是二级子域，通配符 *.power-knowledge.tech 只覆盖一级，盖不到它。
#   独立证书可零影响其余 13 个 vhost 与共用的 pk-wildcard。
#
# 本文件是留档模板；线上生效的是 /etc/nginx/sites-available/control-mode。
# 改动两侧必须同步，且每次改完跑 `nginx -t` 再 reload。

# ── 80：仅 ACME 挑战 + 跳 HTTPS ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name control-mode.power-knowledge.tech www.control-mode.power-knowledge.tech;

    include snippets/acme.conf;

    access_log /var/log/nginx/control-mode.access.log;
    error_log  /var/log/nginx/control-mode.error.log;

    location / {
        return 301 https://www.control-mode.power-knowledge.tech$request_uri;
    }
}

# ── 443：裸名 301 到 www ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name control-mode.power-knowledge.tech;

    ssl_certificate     /etc/letsencrypt/live/control-mode.power-knowledge.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/control-mode.power-knowledge.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    # 续期时 LE 会经 HTTPS 取挑战文件，443 块没有这个路径就 404 → 续期失败
    include snippets/acme.conf;

    return 301 https://www.control-mode.power-knowledge.tech$request_uri;
}

# ── 443：主站（www）──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.control-mode.power-knowledge.tech;

    ssl_certificate     /etc/letsencrypt/live/control-mode.power-knowledge.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/control-mode.power-knowledge.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    include snippets/acme.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/control-mode;
    index index.html;

    # 隐藏文件防护：挡住 /.deployed-version、/.env、/.git/config 的公网探测。
    # ⚠ 必须排在所有正则 location 之前，否则会被先到的规则抢走。
    include snippets/security-hardening.conf;

    access_log /var/log/nginx/control-mode.access.log;
    error_log  /var/log/nginx/control-mode.error.log;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # SPA 回退：深链接刷新交给前端路由处理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
